version: '3.8'

services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    container_name: cadvisor
    ports:
      - "8082:8080"  # optional if you want cAdvisor web UI
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    networks:
      - internal-proxy
    restart: unless-stopped

  # 💾 S3 STORAGE: MINIO
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      - MINIO_ROOT_USER=minioadmin   # <-- CHANGE ME
      - MINIO_ROOT_PASSWORD=minio123 # <-- CHANGE ME
    ports:
      - "9001:9001" # Console port only
    volumes:
      - minio_data:/data
      - ./config/minio:/root/.minio
    command: server /data --console-address :9001
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`minio.localdev`)"
      - "traefik.http.routers.minio.entrypoints=web"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"
    networks:
      - internal-proxy
    restart: unless-stopped

  # 📝 LOGS: LOKI
  loki:
    image: grafana/loki:latest
    container_name: loki
    volumes:
      - ./config/loki/config.yaml:/etc/loki/config.yaml
    command: -config.file=/etc/loki/config.yaml
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loki.rule=Host(`loki.localdev`)"
      - "traefik.http.routers.loki.entrypoints=web"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"
    networks:
      - internal-proxy
    restart: unless-stopped

  # 📊 VISUALIZATION: GRAFANA
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=strongpassword
    volumes:
      - grafana_data:/var/lib/grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localdev`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    networks:
      - internal-proxy
    restart: unless-stopped

  # 📈 METRICS: PROMETHEUS
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.listen-address=:9090'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.localdev`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    networks:
      - internal-proxy
    restart: unless-stopped

  # 📊 HOST METRICS: NODE EXPORTER
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks:
      - internal-proxy
    restart: unless-stopped

# Volumes for persistent data
volumes:
  minio_data:
  grafana_data:
  prometheus_data:

# External network definition
networks:
  internal-proxy:
    external: true
